<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1218"/>
      <stop offset="100%" style="stop-color:#0a0c10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#0099bb"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39ff6e"/>
      <stop offset="100%" style="stop-color:#20cc50"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="52" ry="52" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="256" height="256" rx="52" ry="52" fill="none"
    stroke="#1e2535" stroke-width="2"/>

  <!-- Outer hex ring -->
  <polygon points="128,22 210,68 210,160 128,206 46,160 46,68"
    fill="none" stroke="#1e2535" stroke-width="2"/>

  <!-- Inner hex -->
  <polygon points="128,42 194,80 194,156 128,194 62,156 62,80"
    fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>

  <!-- Server rack bars - left side -->
  <rect x="72" y="88" width="44" height="10" rx="3" fill="url(#accent)" filter="url(#glow)" opacity="0.9"/>
  <rect x="72" y="104" width="44" height="10" rx="3" fill="url(#accent)" opacity="0.5"/>
  <rect x="72" y="120" width="44" height="10" rx="3" fill="url(#accent)" opacity="0.3"/>

  <!-- Server rack bars - right side -->
  <rect x="140" y="88" width="44" height="10" rx="3" fill="url(#green)" filter="url(#glow)" opacity="0.9"/>
  <rect x="140" y="104" width="44" height="10" rx="3" fill="url(#green)" opacity="0.5"/>
  <rect x="140" y="120" width="44" height="10" rx="3" fill="url(#green)" opacity="0.3"/>

  <!-- Center divider line -->
  <line x1="128" y1="78" x2="128" y2="178" stroke="#1e2535" stroke-width="2"/>

  <!-- N letterform - bold geometric -->
  <path d="M 95 148 L 95 108 L 115 138 L 115 108"
    fill="none" stroke="url(#accent)" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#glow2)"/>

  <!-- P letterform -->
  <path d="M 141 148 L 141 108 M 141 108 L 157 108 Q 165 108 165 118 Q 165 128 157 128 L 141 128"
    fill="none" stroke="url(#green)" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#glow2)"/>

  <!-- Bottom status dots -->
  <circle cx="100" cy="168" r="5" fill="#39ff6e" filter="url(#glow)" opacity="0.9"/>
  <circle cx="116" cy="168" r="5" fill="#00e5ff" opacity="0.6"/>
  <circle cx="132" cy="168" r="5" fill="#00e5ff" opacity="0.3"/>
  <circle cx="148" cy="168" r="5" fill="#1e2535"/>
  <circle cx="164" cy="168" r="5" fill="#1e2535"/>
</svg>

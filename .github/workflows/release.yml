name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'   # Triggers on any semver tag push, e.g. v1.0.0, v1.2.3
  workflow_dispatch:  # Also allow manual trigger from Actions tab

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write   # Needed to create the release and upload the .exe

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK / CSC_KEY_PASSWORD would go here once code signing is set up
          # For now, we ship unsigned.
